; PlatformIO Project Configuration File
;
; One environment per board. Build a specific one with `pio run -e pico2`; plain `pio run` builds
; the default, the RP2350 board the current prototype uses.
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = rp2350_zero

; Shared by every environment below.
;
; The firmware version lives here and nowhere else: scripts/build_info.py hands it to the code and
; refuses to build a tagged commit whose tag says otherwise. Bump it with each release.
;
; Each board environment also sets custom_board_id, which the device reports in the handshake so
; a firmware update can pick the image built for it. The ids are listed in the application's
; docs/PROTOCOL.md; add a new one there when adding a board.
[env]
custom_firmware_version = 0.2.1
extra_scripts = pre:scripts/build_info.py
; USB identity: the strings the host sees in its device descriptors, instead of the board's
; "Raspberry Pi" / board name. The VID and PID stay the board's own (Raspberry Pi's VID): the app
; finds the device by that VID, and a dedicated PID needs to be requested from Raspberry Pi first.
board_build.arduino.earlephilhower.usb_manufacturer = Mechardo Labs
board_build.arduino.earlephilhower.usb_product = DS2000

; Waveshare RP2350-Zero, the board the current prototype uses.
;
; Same RP2350A silicon as the Pico 2, but its own variant: 4 MB flash, and the only onboard LED
; is a WS2812 on GPIO16 rather than a plain one, so LED_BUILTIN is not defined for it. The
; buttons and RGB pins the project uses (GPIO 2-10) are all exposed on its header.
[env:rp2350_zero]
custom_board_id = 0x01
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = waveshare_rp2350_zero
framework = arduino
board_build.core = earlephilhower

; Raspberry Pi Pico 2 (RP2350).
;
; The official `platform = raspberrypi` does not support RP2350, so this uses the community
; platform with earlephilhower's Arduino core. The firmware needs nothing beyond analogWrite,
; Serial, pinMode, millis and attachInterrupt, all of which that core provides, so no source
; changes were required to move across.
[env:pico2]
custom_board_id = 0x02
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
board_build.core = earlephilhower

; Host build for the framing tests in test/: `pio test -e native`. Needs a C++ compiler on the
; PATH (gcc or clang); nothing here runs on the board.
[env:native]
platform = native
test_framework = unity

; Raspberry Pi Pico (RP2040), the original target. Kept so existing boards stay buildable.
;
; Same community platform and earlephilhower core as the RP2350 boards. The official platform ships
; the Arduino mbed core, which has no rp2040.rebootToBootloader(), so RebootToBootloader could not
; build there.
[env:pico]
custom_board_id = 0x03
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower

; The pixel LED driver (rev A's WS2812-compatible chain) on the RP2350-Zero's onboard WS2812, so the
; driver can be tried before a rev A board exists. A development build, left out of releases: it
; is the same board as rp2350_zero, and a single pixel only shows the mute LED. The module's
; WS2812 takes GRB, like rev A's LEDs, so the driver's default order holds.
[env:rp2350_zero_pixel]
extends = env:rp2350_zero
build_flags =
    -D LED_DRIVER_PIXEL
    -D LED_DATA=16
    -D LED_COUNT=1
lib_deps =
    adafruit/Adafruit NeoPixel@1.12.3
