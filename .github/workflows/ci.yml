name: CI

on:
  # No base-branch filter: feature branches can stack on each other, so a PR is not always
  # targeting main. Filtering by base would silently skip CI on those.
  pull_request:
  push:
    branches: [main]
    # A version tag also attaches the images to a draft release (the release job below), so a
    # release is only cut from a commit whose tests and builds pass.
    tags: ['v*']

# Read-only by default; the release job asks for write on its own.
permissions:
  contents: read

# A new push to the same PR cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: protocol tests (native)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install platformio

      # The framing tests (against the reference frames in the application's docs/PROTOCOL.md), the
      # message parsing tests and the debounce tests run on the host. ubuntu-latest ships gcc, which
      # is all the native environment needs.
      - name: Test
        run: pio test -e native

  build:
    name: build (${{ matrix.env }})
    runs-on: ubuntu-latest

    strategy:
      # One board failing should not hide whether the others build.
      fail-fast: false
      matrix:
        include:
          - env: rp2350_zero
          - env: pico2
          - env: pico
          - env: rev_a
          # The pixel driver on the RP2350-Zero's onboard LED, for trying it without a rev A board.
          # Not released: its artifact is named dev-firmware-*, which the release job does not pick up.
          - env: rp2350_zero_pixel
            dev: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install platformio

      # The platform, the earlephilhower core and its toolchain are several hundred MB and are
      # downloaded on first use. Keyed on platformio.ini, which is where all of them are chosen.
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
          restore-keys: platformio-${{ runner.os }}-${{ matrix.env }}-

      - name: Build
        run: pio run -e ${{ matrix.env }}

      # The image a reviewer can drag onto the board in USB boot mode to try the PR.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.dev && 'dev-' || '' }}firmware-${{ matrix.env }}
          path: .pio/build/${{ matrix.env }}/firmware.uf2
          if-no-files-found: error

  release:
    name: draft release
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    # Creating the release and uploading the images to it.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # platformio.ini is the single source of the version: build_info.py already refuses to build
      # a tagged commit that disagrees with it, and this says so in one line instead of three
      # failed builds.
      - name: Read the version
        id: version
        run: |
          version=$(sed -n 's/^custom_firmware_version *= *//p' platformio.ini)
          protocol=$(sed -n 's/^const uint8_t PROTOCOL_VERSION = \([0-9]*\);/\1/p' src/main.cpp)
          if [ -z "$version" ] || [ -z "$protocol" ]; then
            echo "::error::Could not read the version ($version) or the protocol ($protocol)"
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in platformio.ini"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "protocol=$protocol" >> "$GITHUB_OUTPUT"

      # The version's CHANGELOG.md entry opens the release notes, and announce.yml posts it to
      # Discord. The entry runs to the next version heading, or to the link definitions after the
      # last one.
      - name: Read the changelog entry
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v heading="## [$VERSION]" \
            '/^## \[/ { if (found) exit; found = (index($0, heading) == 1); next }
             /^\[[^]]+\]: / { exit }
             found' \
            CHANGELOG.md | sed '/./,$!d' > whats-new.md
          if [ ! -s whats-new.md ]; then
            echo "::error::CHANGELOG.md has no entry for $VERSION: the release pull request moves Unreleased under [$VERSION]"
            exit 1
          fi
          cat whats-new.md

      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: artifacts

      # Every build is called firmware.uf2, so each gets the board's environment in its name. The
      # environment is the stable key: the app maps the board id the device reports to it, through
      # the board id table in the app's docs/PROTOCOL.md, to pick the image to install (DS2000#35).
      - name: Name the images
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir dist
          for dir in artifacts/firmware-*; do
            board=${dir#artifacts/firmware-}
            cp "$dir/firmware.uf2" "dist/DS2000-Firmware_${VERSION}_${board}.uf2"
          done
          cd dist
          sha256sum *.uf2 > SHA256SUMS
          cat SHA256SUMS

      # The app installs only images whose minisign signature checks against the public key it
      # ships with, the one in minisign.pub (DS2000#35). Tauri's signer does the signing and writes
      # the signature base64-encoded; it is decoded into a standard .minisig, and checked with
      # minisign itself so a key that does not match minisign.pub fails here, not in the app.
      - name: Sign the images
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.FIRMWARE_SIGNING_KEY }}
          TAURI_PRIVATE_KEY_PASSWORD: ${{ secrets.FIRMWARE_SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_PRIVATE_KEY" ]; then
            echo "::error::The FIRMWARE_SIGNING_KEY secret is not set, and the app refuses unsigned images"
            exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign > /dev/null
          cd dist
          for image in *.uf2; do
            npx --yes @tauri-apps/cli@2.7.1 signer sign "$image" > /dev/null
            base64 -d "$image.sig" > "$image.minisig"
            rm "$image.sig"
            minisign -V -q -p ../minisign.pub -m "$image"
          done

      # A draft, so publishing stays a human decision. Re-running the workflow for the same tag
      # replaces the images instead of failing on the existing release.
      - name: Attach the images to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          PROTOCOL: ${{ steps.version.outputs.protocol }}
        run: |
          cd dist
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" *.uf2 *.minisig SHA256SUMS --clobber
            exit 0
          fi
          { printf "## What's new\n\n"; cat ../whats-new.md; printf '\n'; } > ../notes.md
          cat >> ../notes.md <<EOF
          ## Compatibility

          This release speaks **serial protocol $PROTOCOL**. Pair it with a
          [DS2000](https://github.com/Mechanix97/DS2000/releases) app release on the same protocol.

          ## Flashing

          Pick the image for your board:

          | Board | Image |
          |---|---|
          | DS2000 rev A | \`*_rev_a.uf2\` |
          | Waveshare RP2350-Zero | \`*_rp2350_zero.uf2\` |
          | Raspberry Pi Pico 2 | \`*_pico2.uf2\` |
          | Raspberry Pi Pico (RP2040) | \`*_pico.uf2\` |

          Hold the board's BOOT button while plugging it in. It shows up as a USB drive: copy the
          image onto it, and the board restarts with the new firmware. The DS2000 rev A has no BOOT
          button: a new board with empty flash shows up as that drive on its own; otherwise bridge
          the BOOT pads (JP1, underneath) while plugging it in. Once a release is on it, the DS2000
          app installs the next ones.

          ## Verifying

          Each image has a [minisign](https://jedisct1.github.io/minisign/) signature next to it,
          which the DS2000 app checks before installing. To check one yourself:

          \`\`\`
          minisign -Vm DS2000-Firmware_<version>_<board>.uf2 -P $(sed -n 2p ../minisign.pub)
          \`\`\`

          ## Checksums

          \`\`\`
          $(cat SHA256SUMS)
          \`\`\`
          EOF
          gh release create "$GITHUB_REF_NAME" *.uf2 *.minisig SHA256SUMS --draft --verify-tag \
            --title "DS2000-Firmware $GITHUB_REF_NAME" --notes-file ../notes.md --generate-notes
